name: Backup SigaTech - Supabase a Google Drive

on:
  workflow_dispatch:
    inputs:
      periodo:
        description: "Selecciona el backup manual"
        required: true
        default: "tarde"
        type: choice
        options:
          - tarde
          - noche

  schedule:
    # Todos los días a las 12:00 p. m. hora de Colombia
    - cron: "0 12 * * *"
      timezone: "America/Bogota"

    # Todos los días a las 11:00 p. m. hora de Colombia
    - cron: "0 23 * * *"
      timezone: "America/Bogota"

permissions:
  contents: read

concurrency:
  group: backup-sigatech-supabase
  cancel-in-progress: false

env:
  POSTGRES_IMAGE: "postgres:17-alpine"
  BACKUP_PREFIX: "SigaTech-backup"
  DRIVE_FOLDER: "Backup/SigaTech"

jobs:
  backup:
    name: Crear y subir backup
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ---------------------------------------------------------
      # 1. Preparar el nombre del backup
      # ---------------------------------------------------------
      - name: Preparar nombre del backup
        shell: bash
        run: |
          set -euo pipefail

          LOCAL_DATE="$(TZ=America/Bogota date +'%Y-%m-%d')"
          CURRENT_SCHEDULE="${{ github.event.schedule }}"
          MANUAL_PERIOD="${{ github.event.inputs.periodo }}"

          if [[ "$CURRENT_SCHEDULE" == "0 12 * * *" ]]; then
            BACKUP_PERIOD="tarde"
          elif [[ "$CURRENT_SCHEDULE" == "0 23 * * *" ]]; then
            BACKUP_PERIOD="noche"
          else
            BACKUP_PERIOD="${MANUAL_PERIOD:-tarde}"
          fi

          BACKUP_FILE="${BACKUP_PREFIX}-${LOCAL_DATE}-${BACKUP_PERIOD}.dump"
          BACKUP_PATH="${GITHUB_WORKSPACE}/backups/${BACKUP_FILE}"

          echo "BACKUP_FILE=$BACKUP_FILE" >> "$GITHUB_ENV"
          echo "BACKUP_PATH=$BACKUP_PATH" >> "$GITHUB_ENV"
          echo "BACKUP_PERIOD=$BACKUP_PERIOD" >> "$GITHUB_ENV"

          echo "============================================"
          echo "Archivo: $BACKUP_FILE"
          echo "Periodo: $BACKUP_PERIOD"
          echo "Destino: gdrive:${DRIVE_FOLDER}/${BACKUP_FILE}"
          echo "============================================"

      # ---------------------------------------------------------
      # 2. Comprobar los secretos
      # ---------------------------------------------------------
      - name: Verificar secretos
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          RCLONE_SECRET: ${{ secrets.RCLONE_CONFIG_BASE64 }}
        run: |
          set -euo pipefail

          if [[ -z "${DATABASE_URL:-}" ]]; then
            echo "ERROR: No existe el secreto SUPABASE_DATABASE_URL."
            exit 1
          fi

          if [[ -z "${RCLONE_SECRET:-}" ]]; then
            echo "ERROR: No existe el secreto RCLONE_CONFIG_BASE64."
            exit 1
          fi

          echo "Los dos secretos están configurados."

      # ---------------------------------------------------------
      # 3. Crear el backup de Supabase
      # ---------------------------------------------------------
      - name: Crear backup de Supabase
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/backups"

          docker run --rm \
            -e DATABASE_URL \
            -e BACKUP_FILE \
            -v "$GITHUB_WORKSPACE/backups:/backups" \
            "$POSTGRES_IMAGE" \
            sh -ceu '
              pg_dump \
                --dbname="$DATABASE_URL" \
                --format=custom \
                --compress=9 \
                --no-owner \
                --no-acl \
                --file="/backups/$BACKUP_FILE"
            '

          echo "Backup generado."

      # ---------------------------------------------------------
      # 4. Validar que el backup sirve
      # ---------------------------------------------------------
      - name: Validar backup
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f "$BACKUP_PATH" ]]; then
            echo "ERROR: No se creó el archivo."
            exit 1
          fi

          if [[ ! -s "$BACKUP_PATH" ]]; then
            echo "ERROR: El archivo quedó vacío."
            exit 1
          fi

          docker run --rm \
            -e BACKUP_FILE \
            -v "$GITHUB_WORKSPACE/backups:/backups" \
            "$POSTGRES_IMAGE" \
            sh -ceu '
              pg_restore \
                --list \
                "/backups/$BACKUP_FILE" > /dev/null
            '

          echo "Backup validado correctamente."
          ls -lh "$BACKUP_PATH"

      # ---------------------------------------------------------
      # 5. Instalar Rclone
      # ---------------------------------------------------------
      - name: Instalar Rclone
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y rclone

          rclone version

      # ---------------------------------------------------------
      # 6. Cargar conexión con Google Drive
      # ---------------------------------------------------------
      - name: Configurar Google Drive
        shell: bash
        env:
          RCLONE_CONFIG_BASE64: ${{ secrets.RCLONE_CONFIG_BASE64 }}
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.config/rclone"

          printf '%s' "$RCLONE_CONFIG_BASE64" \
            | base64 --decode \
            > "$HOME/.config/rclone/rclone.conf"

          chmod 600 "$HOME/.config/rclone/rclone.conf"

          unset RCLONE_CONFIG_BASE64

          if ! rclone listremotes | grep -qx "gdrive:"; then
            echo "ERROR: No se encontró la conexión gdrive."
            exit 1
          fi

          echo "Conexión con Google Drive cargada."

      # ---------------------------------------------------------
      # 7. Verificar la carpeta de SigaTech
      # ---------------------------------------------------------
      - name: Verificar carpeta de Google Drive
        shell: bash
        run: |
          set -euo pipefail

          if ! rclone lsf \
            "gdrive:${DRIVE_FOLDER}" \
            --dirs-only > /dev/null; then

            echo "ERROR: No se pudo abrir gdrive:${DRIVE_FOLDER}"
            exit 1
          fi

          echo "Carpeta encontrada: gdrive:${DRIVE_FOLDER}"

      # ---------------------------------------------------------
      # 8. Subir el backup a Google Drive
      # ---------------------------------------------------------
      - name: Subir backup a Google Drive
        shell: bash
        run: |
          set -euo pipefail

          REMOTE_FILE="gdrive:${DRIVE_FOLDER}/${BACKUP_FILE}"

          rclone copyto \
            "$BACKUP_PATH" \
            "$REMOTE_FILE" \
            --retries 3 \
            --low-level-retries 10 \
            --transfers 1 \
            --checkers 2 \
            --stats 10s \
            --stats-one-line

          echo "Subida terminada."

      # ---------------------------------------------------------
      # 9. Confirmar que el archivo llegó completo
      # ---------------------------------------------------------
      - name: Verificar backup en Google Drive
        shell: bash
        run: |
          set -euo pipefail

          REMOTE_FILE="gdrive:${DRIVE_FOLDER}/${BACKUP_FILE}"
          LOCAL_SIZE="$(stat -c%s "$BACKUP_PATH")"

          REMOTE_SIZE="$(
            rclone lsl "$REMOTE_FILE" |
            awk 'NR == 1 {print $1}'
          )"

          if [[ -z "$REMOTE_SIZE" ]]; then
            echo "ERROR: El archivo no apareció en Google Drive."
            exit 1
          fi

          if [[ "$LOCAL_SIZE" != "$REMOTE_SIZE" ]]; then
            echo "ERROR: El tamaño del archivo no coincide."
            echo "Tamaño local: $LOCAL_SIZE"
            echo "Tamaño en Drive: $REMOTE_SIZE"
            exit 1
          fi

          echo "Backup verificado correctamente."
          echo "Archivo: $BACKUP_FILE"
          echo "Tamaño: $REMOTE_SIZE bytes"

      # ---------------------------------------------------------
      # 10. Eliminar backups de más de dos días de antigüedad
      # ---------------------------------------------------------
      - name: Eliminar backups antiguos
        shell: bash
        run: |
          set -euo pipefail

          # Conserva el día actual y los dos días anteriores.
          CUTOFF_DATE="$(TZ=America/Bogota date -d '2 days ago' +'%Y-%m-%d')"

          echo "Se conservarán backups desde: $CUTOFF_DATE"

          while IFS= read -r REMOTE_FILE; do

            if [[ "$REMOTE_FILE" =~ ^SigaTech-backup-([0-9]{4}-[0-9]{2}-[0-9]{2})-(tarde|noche)\.dump$ ]]; then

              FILE_DATE="${BASH_REMATCH[1]}"

              if [[ "$FILE_DATE" < "$CUTOFF_DATE" ]]; then
                echo "Eliminando permanentemente: $REMOTE_FILE"

                rclone deletefile \
                  "gdrive:${DRIVE_FOLDER}/${REMOTE_FILE}" \
                  --drive-use-trash=false
              else
                echo "Conservando: $REMOTE_FILE"
              fi

            fi

          done < <(
            rclone lsf \
              "gdrive:${DRIVE_FOLDER}" \
              --files-only \
              --include "SigaTech-backup-*.dump"
          )

      # ---------------------------------------------------------
      # 11. Mostrar los backups disponibles
      # ---------------------------------------------------------
      - name: Mostrar backups conservados
        shell: bash
        run: |
          echo "============================================"
          echo "BACKUPS DISPONIBLES EN GOOGLE DRIVE"
          echo "============================================"

          rclone lsl \
            "gdrive:${DRIVE_FOLDER}" \
            --include "SigaTech-backup-*.dump" || true
      # ---------------------------------------------------------
      # 12. Eliminar el archivo temporal de GitHub
      # ---------------------------------------------------------
      - name: Eliminar archivo temporal
        if: always()
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/backups"
          echo "Archivo temporal eliminado del servidor de GitHub."